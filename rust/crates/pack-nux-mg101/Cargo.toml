[package]
name = "mg101-pack-nux-mg101"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Device Pack NUX MG-101: profil, katalog efektów, kodek .mg101patch, protokół SysEx."
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

# Device Pack MG-101: profile (dane) + codec (189B rekord <-> kanonik <-> .mg101patch) + protocol (SysEx). Round-trip 1:1 w E1/E2.
[dependencies]
mg101-core = { path = "../core" }
mg101-device-pack-api = { path = "../device-pack-api" }
mg101-device-link = { path = "../device-link" }

[features]
# Testy wierności vs FABRYCZNY zrzut NUX (własność producenta, poza repo). Wgraj
# lokalnie `oracle/factory-patches.mg101patch` + `oracle/hw-factory-wire.bin`, potem:
#   cargo test -p mg101-pack-nux-mg101 --features hardware-oracle
hardware-oracle = []

[lib]
name = "mg101_pack_nux_mg101"
path = "src/lib.rs"
