[package]
name = "mg101-library"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Trwała biblioteka patchy (SQLite): rewizje, WAL, metadane, kolekcje."
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

# Biblioteka patchy: store, tagi, grupy, fingerprint, provenance, stan trojdrozny
# (HLD sekcje 3-4). E4. Device-agnostyczna: zna tylko blob (bajty święte) + hashe
# + adres slotu z kontraktu packa. NIE zna modelu kanonicznego (to rola packa).
[dependencies]
mg101-device-pack-api = { path = "../device-pack-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Trwały store (desktop) — SQLite z bundled sqlite (bez zależności systemowej).
# Wyłączony na wasm (tam inny backend: IndexedDB/HTTP).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[lib]
name = "mg101_library"
path = "src/lib.rs"
