[package]
name = "mg101-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aplikacja desktop MG101 Studio (Slint) — biblioteka, edytor, agent AI, mostek MCP."
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

# Powloka desktop (macOS + Windows) — UI w Slint (natywny Rust), wywolania rdzenia
# natywnie. E7: warstwa VM/i18n (testowalna, bez Slint) + binarka Slint.
[dependencies]
mg101-core = { path = "../core" }
mg101-commands = { path = "../commands" }
mg101-studio = { path = "../studio" }
mg101-library = { path = "../library" }
mg101-transfer-engine = { path = "../transfer-engine" }
mg101-agent-core = { path = "../agent-core" }
mg101-device-link = { path = "../device-link" }
mg101-device-pack-api = { path = "../device-pack-api" }
mg101-pack-nux-mg101 = { path = "../pack-nux-mg101" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UI Slint tylko na natywnych (macOS/Windows/Linux) — nie na wasm. Backend
# renderer domyślny (femtovg/OpenGL wg platformy).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
slint = { version = "1.8", default-features = true }
# Natywne okno wyboru pliku (import .mg101patch) — macOS/Windows/Linux.
rfd = "0.15"

# Przechowalnia klucza API — backend per-OS (parytet v1: service
# dev.mos.mg101studio.ai). macOS: Keychain, Windows: Credential Manager,
# Linux: keyutils (linux-native, czysty Rust — bez zależności systemowych).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native"] }

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]
slint-build = "1.8"

# Tylko dla przykładów diagnostycznych (midi_monitor) — bezpośredni dostęp do
# wszystkich portów MIDI, poza abstrakcją MidirLink (jeden port).
[dev-dependencies]
midir = "0.10"

[lib]
name = "mg101_desktop"
path = "src/lib.rs"

[[bin]]
name = "mg101-desktop"
path = "src/main.rs"
