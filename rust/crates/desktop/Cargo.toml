[package]
name = "mg101-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

# Powloka desktop (macOS + Windows) — UI w Slint (natywny Rust), wywolania rdzenia
# natywnie. E7: warstwa VM/i18n (testowalna, bez Slint) + binarka Slint.
[dependencies]
mg101-core = { path = "../core" }
mg101-commands = { path = "../commands" }
mg101-studio = { path = "../studio" }
mg101-library = { path = "../library" }
mg101-transfer-engine = { path = "../transfer-engine" }
mg101-agent-core = { path = "../agent-core" }
mg101-device-link = { path = "../device-link" }
mg101-device-pack-api = { path = "../device-pack-api" }
mg101-pack-nux-mg101 = { path = "../pack-nux-mg101" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UI Slint tylko na natywnych (macOS/Windows) — nie na wasm. Backend renderer
# domyślny (skia/femtovg wg platformy).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
slint = { version = "1.8", default-features = true }
# Natywne okno wyboru pliku (import .mg101patch) — macOS/Windows/Linux.
rfd = "0.15"
# Przechowalnia klucza API: Keychain (macOS) / Credential Manager (Windows).
# Parytet z v1 (KeychainStore, service dev.mos.mg101studio.ai).
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
] }

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]
slint-build = "1.8"

# Tylko dla przykładów diagnostycznych (midi_monitor) — bezpośredni dostęp do
# wszystkich portów MIDI, poza abstrakcją MidirLink (jeden port).
[dev-dependencies]
midir = "0.10"

[lib]
name = "mg101_desktop"
path = "src/lib.rs"

[[bin]]
name = "mg101-desktop"
path = "src/main.rs"
