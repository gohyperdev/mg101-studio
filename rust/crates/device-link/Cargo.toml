[package]
name = "mg101-device-link"
version.workspace = true
edition.workspace = true
license.workspace = true

# Transport MIDI/SysEx cross-platform. Warstwa reasemblacji jest czysta
# (bez zależności sprzętowych) i testowalna; backendy midir (E2) / WebMIDI (web)
# dokładane później za traitem `DeviceLink`.
[dependencies]

# Backend sprzętowy MIDI tylko dla celów natywnych (wykluczony z wasm32, gdzie
# transport dają WebMIDI-owe wiązania). Warstwa reasemblacji pozostaje czysta.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
midir = "0.10"

[lib]
name = "mg101_device_link"
path = "src/lib.rs"
