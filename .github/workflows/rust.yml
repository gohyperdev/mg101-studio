name: rust
on:
  push:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]

# Najmniejsze uprawnienia tokena (review E0/K1) — CI tylko czyta repo.
permissions:
  contents: read

jobs:
  # Build+test całego workspace (w tym desktop/Slint — dowód #4 cross-platform)
  # na macOS i Windows. GUI Slint nie startuje w `cargo test` (okno tylko w
  # main()); testy to warstwa VM/i18n, przenośna między systemami.
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Zależności systemowe Slint (femtovg/winit + OpenGL) i rfd (GTK) — tylko Linux.
      - name: Zależności GUI (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libgtk-3-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose
      - name: Build desktop (Slint) — dowód #4
        run: cargo build -p mg101-desktop --verbose
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --all -- --check

  wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - name: Build rdzeń + pack → wasm32 (dowód #7)
        run: |
          cargo build -p mg101-core --target wasm32-unknown-unknown
          cargo build -p mg101-pack-nux-mg101 --target wasm32-unknown-unknown
      # Pinowana akcja zamiast `curl | bash` niewersjonowanego skryptu (review
      # E0/K1 — supply-chain). Instaluje wasmtime na PATH.
      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "v27.0.0"
      - name: Kodek round-trip 1:1 w WASM
        run: |
          cargo build -p mg101-pack-nux-mg101 --example wasm_roundtrip --target wasm32-wasip1
          wasmtime run target/wasm32-wasip1/debug/examples/wasm_roundtrip.wasm
